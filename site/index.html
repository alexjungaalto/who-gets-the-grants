<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Gets the Grants — computer-science research funding in Europe</title>
<meta name="description" content="The computer scientists who secured the most research funding in each European country — ERC, FWF (Austria) and the Research Council of Finland — and how much they teach.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f7f6f3; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e1dc;
    --accent:#1c5b7d; --accent2:#c2601f; --warn:#8a5a00; --warnbg:#fdf5e3;
    --c1:#eef3f6; --c2:#cfe0e9; --c3:#a6c8d9; --c4:#6fa5c1; --c5:#37768f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  header{padding:26px 22px 18px;max-width:1280px;margin:0 auto}
  h1{margin:0 0 6px;font-size:27px;letter-spacing:-.4px}
  .sub{color:var(--muted);max-width:70ch;margin:0 0 14px}
  .note{background:var(--warnbg);border:1px solid #f0e2bf;color:var(--warn);
        padding:10px 13px;border-radius:9px;font-size:13.5px;max-width:95ch}
  .disclaimer{background:#fdecea;border:1px solid #f3c6c0;border-left:4px solid #b3392c;
              color:#7d2b21;padding:11px 14px;border-radius:9px;font-size:13.5px;
              max-width:95ch;margin:0 0 10px}
  .disclaimer a{color:#7d2b21}
  .wrap{display:grid;grid-template-columns:minmax(340px,1fr) minmax(430px,1.25fr);
        gap:18px;max-width:1280px;margin:0 auto;padding:0 22px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
  #map{height:560px;border-radius:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;
        padding:3px 10px;font-size:12.5px;cursor:pointer;color:#3a3a3e}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
          padding:10px 14px;font-size:12.5px;color:var(--muted)}
  .swatch{display:inline-block;width:15px;height:11px;border:1px solid #bbb;
          vertical-align:-1px;margin-right:5px}
  .panel{padding:16px 18px;min-height:560px}
  .panel h2{margin:0 0 2px;font-size:20px}
  .panel .where{color:var(--muted);font-size:13px;margin-bottom:12px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
  .stat{background:var(--c1);border:1px solid var(--line);border-radius:9px;
        padding:7px 11px;min-width:104px}
  .stat b{display:block;font-size:17px}
  .stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;
     text-transform:uppercase;letter-spacing:.4px;padding:6px 7px;border-bottom:1px solid var(--line)}
  td{padding:7px;border-bottom:1px solid #f0efec;vertical-align:top}
  tr.person{cursor:pointer}
  tr.person:hover{background:#f4f8fa}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .nm{font-weight:600}
  .inst{color:var(--muted);font-size:12px}
  .grants{background:#fbfaf8;font-size:12.5px;color:#3a3a3e}
  .grants ul{margin:4px 0 4px 16px;padding:0}
  .grants li{margin:2px 0}
  .tag{display:inline-block;background:#eceff1;border-radius:4px;padding:0 5px;
       font-size:11px;color:#4a4a50;margin-right:5px}
  .na{color:#a8a8ad}
  footer{max-width:1280px;margin:0 auto;padding:10px 22px 60px;color:var(--muted);font-size:13px}
  footer h3{color:var(--ink);font-size:15px;margin:22px 0 6px}
  footer li{margin:4px 0}
  a{color:var(--accent)}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}#map{height:380px}}
</style>
</head>
<body>
<header>
  <h1>Who gets the grants?</h1>
  <p class="sub">The computer scientists who won the most competitive research funding in each
     European country — and, where a public course catalogue allows it, how much they teach.
     Click a country on the map.</p>
  <div class="disclaimer" id="disclaimer"></div>
  <div class="note" id="coverage"></div>
</header>

<div class="wrap">
  <div>
    <div class="card"><div id="map"></div></div>
    <div class="legend" id="legend"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="card panel" id="panel"></div>
</div>

<footer id="method"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA_V='dev';
const GH='alexjungaalto/who-gets-the-grants';   // where corrections are collected
const ISO_FIX={UK:'GB', EL:'GR'};           // CORDIS codes -> geojson iso
const eur=n=> n>=1e6 ? (n/1e6).toFixed(2)+' M' : Math.round(n/1e3)+' k';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA, byCode={}, layer, map, selected=null;

fetch('data/data.json?v='+DATA_V).then(r=>r.json()).then(d=>{
  DATA=d;
  d.countries.forEach(c=>byCode[c.code]=c);
  document.getElementById('disclaimer').innerHTML =
    '<b>These numbers may be wrong.</b> Everything here is assembled automatically from '+
    'public funding databases that were never built to be joined together, and no figure on '+
    'this page has been checked against a person\u2019s CV. Grant records name their principal '+
    'investigator as one unseparated string, so names are reconstructed by a statistical rule: '+
    'one researcher can end up split into two entries, and two researchers who share a surname '+
    'can end up merged into one. Money can be filed under the wrong person, the wrong employer '+
    'or the wrong country; consortium grants are credited whole to whoever the funder names. '+
    'A missing or zero value almost always means <b>not found</b> rather than none. '+
    'Treat any single row as a lead to verify, not as a fact \u2014 and please '+
    '<a href="https://github.com/'+GH+'/issues">report what is wrong</a>.';

  document.getElementById('coverage').innerHTML =
    '<b>Read the two columns separately.</b> ERC money is measured the same way in every country, '+
    'so it can be compared across the map. National-funder money is currently available only for '+
    '<b>Austria (FWF)</b> and <b>Finland (Research Council of Finland)</b> — those two countries look '+
    'better funded here only because nobody else’s national agency has been added yet. '+
    'The map is coloured by ERC money alone.';
  drawMethod();
  return fetch('data/europe.geojson?v='+DATA_V).then(r=>r.json());
}).then(drawMap).catch(e=>{
  document.getElementById('panel').innerHTML='<p>Could not load data: '+esc(e.message)+'</p>';
});

const BREAKS=[0,5e6,20e6,60e6,140e6];
const COLS=['#eef3f6','#cfe0e9','#a6c8d9','#6fa5c1','#37768f'];
function colour(v){let c=COLS[0];for(let i=0;i<BREAKS.length;i++) if(v>BREAKS[i]) c=COLS[i];return c;}

function dataFor(iso){
  for(const c of DATA.countries) if((ISO_FIX[c.code]||c.code)===iso) return c;
  return null;
}

function drawMap(geo){
  map=L.map('map',{zoomControl:true,attributionControl:false,
                   minZoom:3,maxZoom:7}).setView([54,12],3.6);
  layer=L.geoJSON(geo,{
    style:f=>{
      const c=dataFor(f.properties.iso);
      return {fillColor:c?colour(c.erc_eur):'#f3f2ef', fillOpacity:c?.92:.5,
              color:'#fff', weight:1};
    },
    onEachFeature:(f,l)=>{
      const c=dataFor(f.properties.iso);
      l.bindTooltip(f.properties.name + (c? ' — ERC '+eur(c.erc_eur)+' €' : ' — no ERC CS grants'),
                    {sticky:true});
      if(c) l.on('click',()=>select(c.code,l));
    }
  }).addTo(map);
  map.fitBounds([[34,-11],[65,34]]);
  document.getElementById('legend').innerHTML =
    '<span>ERC computer-science funding won, 2007–2022:</span>' +
    ['none / not covered','&lt; 5 M','5–20 M','20–60 M','60–140 M','&gt; 140 M']
      .map((lab,i)=>'<span><i class="swatch" style="background:'+(i?COLS[i-1]:'#f3f2ef')+'"></i>'+lab+'</span>')
      .join('');
  const chips=document.getElementById('chips');
  chips.innerHTML=DATA.countries.map(c=>
    '<button class="chip" data-code="'+c.code+'">'+esc(c.name)+'</button>').join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>select(b.dataset.code));
  select('AT');
}

function select(code,lyr){
  selected=code;
  layer.eachLayer(l=>{
    const c=dataFor(l.feature.properties.iso);
    l.setStyle({weight:(c&&c.code===code)?2.5:1, color:(c&&c.code===code)?'#c2601f':'#fff'});
    if(c&&c.code===code) l.bringToFront();
  });
  document.querySelectorAll('#chips .chip').forEach(b=>
    b.setAttribute('aria-current', b.dataset.code===code ? 'true' : 'false'));
  renderPanel(byCode[code]);
}

function renderPanel(c){
  const p=document.getElementById('panel');
  if(!c){p.innerHTML='<p>Pick a country.</p>';return;}
  const people=DATA.people.filter(x=>x.country===c.code).slice(0,40);
  const hasNat=!!c.national;
  let h='<h2>'+esc(c.name)+(c.associated?' <span class="tag">ERC associated country</span>':'')+'</h2>';
  h+='<div class="where">'+c.n_people+' computer scientists with at least one grant in this dataset</div>';
  h+='<div class="stats">'
   + '<div class="stat"><b>'+eur(c.erc_eur)+' €</b><span>ERC, PE6</span></div>'
   + '<div class="stat"><b>'+c.erc_grants+'</b><span>ERC grants</span></div>'
   + (hasNat?'<div class="stat"><b>'+eur(c.nat_eur)+' €</b><span>'+esc(c.national.name)+'</span></div>':'')
   + '</div>';
  if(hasNat) h+='<div class="where" style="margin-top:-6px">'+esc(c.national.note)+'</div>';
  else h+='<div class="where" style="margin-top:-6px">No national funder added for this country yet — '
        + 'the ranking below reflects ERC grants only.</div>';

  h+='<table><thead><tr><th>#</th><th>Researcher</th><th class="num">ERC</th>'
   + (hasNat?'<th class="num">'+esc(c.national.name)+'</th>':'')
   + '<th class="num">Courses<br>5 yrs</th>'
   + '<th class="num">Lectures<br>online</th></tr></thead><tbody>';
  people.forEach((x,i)=>{
    h+='<tr class="person" data-id="'+esc(x.id)+'">'
     + '<td class="num">'+(i+1)+'</td>'
     + '<td><span class="nm">'+esc(x.name)+'</span><br><span class="inst">'+esc(x.host||'—')+'</span></td>'
     + '<td class="num">'+(x.erc_eur?eur(x.erc_eur):'<span class="na">–</span>')+'</td>'
     + (hasNat?'<td class="num">'+(x.nat_eur?eur(x.nat_eur):'<span class="na">–</span>')+'</td>':'')
     + '<td class="num">'+(x.teaching&&x.teaching.courses!=null
         ? x.teaching.courses : '<span class="na">n/a</span>')+'</td>'
     + '<td class="num">'+ytCell(x)+'</td></tr>'
     + '<tr class="grants" id="g-'+esc(x.id)+'" hidden><td></td><td colspan="'+(hasNat?5:4)+'">'
     + grantHtml(x)+'</td></tr>';
  });
  h+='</tbody></table>';
  p.innerHTML=h;
  p.querySelectorAll('tr.person').forEach(tr=>tr.onclick=()=>{
    const row=document.getElementById('g-'+tr.dataset.id);
    row.hidden=!row.hidden;
  });
}

function ytCell(x){
  if(!x.youtube||!x.youtube.searched) return '<span class="na">n/a</span>';
  if(!x.youtube.episodes) return '<span class="na">0</span>';
  return x.youtube.episodes;
}

function grantHtml(x){
  let h='';
  if(x.erc_grants.length){
    h+='<b>ERC</b><ul>'+x.erc_grants.map(g=>
      '<li><span class="tag">'+esc(g.scheme||'ERC')+' '+(g.year||'')+'</span>'
      +'<b>'+esc(g.acronym||'')+'</b> — '+esc(g.title||'')+' · '+eur(g.eur)+' €</li>').join('')+'</ul>';
  }
  if(x.nat_grants.length){
    const show=x.nat_grants.slice(0,8);
    h+='<b>National funder</b><ul>'+show.map(g=>
      '<li><span class="tag">'+esc(g.scheme||'')+' '+(g.year||'')+'</span>'
      +esc(g.title||'')+' · '+eur(g.eur)+' €'
      +(g.share&&g.share<1?' <span class="inst">('+Math.round(g.share*100)+'% CS)</span>':'')
      +'</li>').join('')+'</ul>';
    if(x.nat_grants.length>show.length)
      h+='<div class="inst">… and '+(x.nat_grants.length-show.length)+' more</div>';
  }
  if(x.youtube&&x.youtube.searched&&x.youtube.items&&x.youtube.items.length){
    h+='<b>Recorded lecture series on YouTube</b><ul>'+x.youtube.items.map(g=>
      '<li><span class="tag">'+g.episodes+' episodes · '+g.minutes+' min</span>'
      +'<a href="'+esc(g.url)+'" target="_blank" rel="noopener">'+esc(g.title)+'</a>'
      +' <span class="inst">'+esc(g.channel)+'</span></li>').join('')+'</ul>';
  }
  if(x.teaching&&x.teaching.courses!=null){
    h+='<b>Teaching</b><ul><li>'+x.teaching.courses+' course instances in '+esc(x.teaching.window)
     +' · source: <a href="'+esc(x.teaching.url)+'">'+esc(x.teaching.source)+'</a></li></ul>';
  }
  return h||'<span class="inst">No detail available.</span>';
}

function drawMethod(){
  const m=DATA.meta;
  document.getElementById('method').innerHTML =
   '<h3>What this counts</h3>'
  +'<ul>'
  +'<li><b>ERC</b> — every European Research Council grant evaluated in panel <b>PE6, '
  +'“Computer Science and Informatics”</b>: '+esc(m.erc_years)+'. A grant is credited to the '
  +'country of its host institution, not the researcher’s nationality. Synergy grants are '
  +'split evenly between their principal investigators.</li>'
  +'<li><b>FWF (Austria)</b> — grants the FWF itself classifies under the research field '
  +'“Computer Sciences”. The FWF records a percentage per field, and the money is weighted by it, '
  +'so a grant tagged 30% computer science contributes 30% of its budget.</li>'
  +'<li><b>Research Council of Finland</b> — decisions tagged “Computer and information sciences” '
  +'in research.fi, using each named person’s own share of the money.</li>'
  +'<li><b>Courses</b> — '+esc((m.teaching&&m.teaching.metric)||'catalogue courses as listed teacher')
  +', in '+esc((m.teaching&&m.teaching.window)||'')+'. Retrieved for <b>'
  +esc(((m.teaching&&m.teaching.covered)||[]).join(', ')||'no university yet')+'</b>; every other '
  +'row says <i>n/a</i>, which means “not retrieved”, never “taught nothing”. The catalogue lists courses, not per-semester deliveries, so a course given every year counts once, and contact hours are not in the data at all. The Austrian catalogues (TU Wien’s TISS, JKU’s KUSSS) cannot be read this way and are not covered.</li>'
  +(m.youtube?'<li><b>Lectures online</b> — '+esc(m.youtube.metric)+'. Searched for '+esc(m.youtube.scope)+' ('+m.youtube.searched+' people, '+m.youtube.with_series+' with a series). '+'<i>'+esc(m.youtube.caveat)+'</i>. A blank means nobody searched; a 0 means searched and none found.</li>':'')
  +'</ul>'
  +'<h3>Known limits</h3>'
  +'<ul>'
  +'<li>Totals are <b>not comparable between countries</b> except in the ERC column.</li>'
  +'<li>The ERC lists principal investigators as one free-text string with no separator between '
  +'family and given name, in several inconsistent conventions. Names here are reconstructed '
  +'statistically; a researcher whose name is recorded two very different ways (for instance '
  +'“Andrei” in one grant and “Andreas” in another) can still appear twice.</li>'
  +'<li>Coordinator-led consortium grants (Clusters of Excellence, doctoral programmes, Finnish '
  +'consortia) are credited to the person the funder names, even though the money is spent by a '
  +'whole group.</li>'
  +'<li>A researcher who moved country appears once per country, under the host that held the grant.</li>'
  +'</ul>'
  +'<h3>Sources</h3><ul>'
  + m.sources.map(s=>'<li><a href="'+esc(s.url)+'">'+esc(s.name)+'</a> — '+esc(s.what)+'</li>').join('')
  +'</ul><p>Built '+esc(m.generated)+'. Public data; no personal data beyond what the funding '
  +'agencies themselves publish about grant holders.</p>';
}
</script>
</body>
</html>
